# Actionable review issue tracker.
#
# Schema:
# - id: stable lowercase hyphenated issue id.
# - created: ISO date.
# - review_type: one of global, readability, notation, topic-maturity, source-coverage, links, graph.
# - status: one of open, in_progress, done, deferred.
# - severity: low, medium, or high.
# - topic_id: topic id, or null for global issues.
# - file: repository-relative file path.
# - issue: concise issue statement.
# - recommended_action: small action; do not include unsupported mathematical claims.
# - requires_new_source: true/false.
# - approval_required: true/false.
# - related_report: report path, or null.
