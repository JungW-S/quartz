# Canonical topic registry.
#
# Schema:
# - id: stable lowercase topic id matching the topic page frontmatter id.
# - title: reader-facing topic title.
# - level: one of overview, prerequisite, core, advanced, reference.
# - topic_kind: one of root, area, concept, construction, theorem, map, operation,
#   category, algebra, basis, object-family, example, provisional.
# - page: Markdown file under content/topics/.
# - summary: short registry summary, not reader-facing prose.
# - parent_topics: broader mathematical concepts. Non-root and non-provisional
#   topics must have at least one parent topic.
# - prerequisite_topics: topics a reader should understand before this topic.
# - child_topics: narrower topics directly below this topic.
# - related_topics: nearby topics that are useful but are not parents,
#   children, or prerequisites.
# - maturity: one of stub, orientation, definition-ready, example-ready,
#   study-ready, reviewed.
# - sidebar_group: one of the large Explorer shelves used for reader navigation.
# - sidebar_order: integer order inside that shelf.
# - conceptual_role: coarse role in the study architecture; this is not a
#   mathematical parent/prerequisite relation.
