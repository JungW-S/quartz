# Research queue for topic-prioritization only.
#
# Schema:
# - topic_id: id from data/topics.yml.
# - priority: integer ranking; lower means earlier review.
# - current_maturity: one of stub, orientation, definition-ready, example-ready, study-ready, reviewed.
# - desired_maturity: one of stub, orientation, definition-ready, example-ready, study-ready, reviewed.
# - missing_components: short component ids, preferably from data/topic_maturity.yml allowed components.
# - candidate_sources: source ids or candidate ids to consider; candidates are not citations.
# - safest_next_task:
#     type: exactly one allowed next-action type from AGENTS.md.
#     description: small reviewable task.
#     requires_new_source: true/false.
#     approval_required: true/false.
#     exact_prompt: prompt the user can paste to trigger the task.
# - alternatives: optional list of other small next tasks with the same fields as safest_next_task.
# - human_review_needed: true when mathematical judgment or source selection is required.
research_queue:
  - topic_id: localized-crystals
    priority: 1
    current_maturity: study-ready
    desired_maturity: reviewed
    missing_components:
      - prerequisite page: general crystal bases
    candidate_sources:
      - kashiwara-nakashima25-crystal-structure-localized-quantum-unipotent-coordinate-category
      - kashiwara93-crystal-base-demazure-character-formula
      - nakashima22-categorified-crystal-localized-quantum-coordinate-rings
    safest_next_task:
      type: topic-page polishing
      description: "Add or approve a prerequisite topic for general crystal bases before expanding localized-crystal details further."
      requires_new_source: true
      approval_required: true
      exact_prompt: "Evaluate source candidates for a general crystal-bases prerequisite page. Update data/source_candidates.yml and reports/roadmap/next-actions.md only; do not download sources, add claims, or create the page until I approve a specific source."
    alternatives:
      - type: existing-source expansion
        description: "Use Kashiwara-Nakashima 2025 Example 9.6 for a slightly more concrete localized-crystal example."
        requires_new_source: false
        approval_required: true
        exact_prompt: "Using only Kashiwara-Nakashima 2025 Example 9.6, propose a minimal concrete example expansion for content/topics/localized-crystals.md; do not edit the page until I approve the exact change."
    human_review_needed: true
