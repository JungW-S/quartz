      exact_prompt: "Evaluate candidate sources for a general crystal-bases prerequisite topic, especially Kashiwara 1993 and Kanakubo-Nakashima 2023. Do not download or ingest any source until I approve one."
    alternatives:
      - type: topic-page polishing
        description: "Audit the cellular-crystals page for undergraduate readability after a crystal-bases prerequisite exists."
        requires_new_source: false
        approval_required: false
        exact_prompt: "Run templates/readability-audit-prompt.md for content/topics/cellular-crystals.md and record issues in data/review_backlog.yml without rewriting the page."
