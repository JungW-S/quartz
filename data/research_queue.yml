# Research queue for topic-prioritization only.
#
# Schema:
# - topic_id: id from data/topics.yml.
# - priority: integer ranking; lower means earlier review.
# - current_maturity: one of stub, orientation, definition-ready, example-ready, study-ready, reviewed.
# - desired_maturity: one of stub, orientation, definition-ready, example-ready, study-ready, reviewed.
# - missing_components: short component ids, preferably from data/topic_maturity.yml allowed components.
# - candidate_sources: source ids or candidate ids to consider; candidates are not citations.
# - safest_next_task:
#     type: exactly one allowed next-action type from AGENTS.md.
#     description: small reviewable task.
#     requires_new_source: true/false.
#     approval_required: true/false.
#     exact_prompt: prompt the user can paste to trigger the task.
# - alternatives: optional list of other small next tasks with the same fields as safest_next_task.
# - human_review_needed: true when mathematical judgment or source selection is required.
