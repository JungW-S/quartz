# Source candidate registry.
#
# Schema:
# - id: stable lowercase hyphenated candidate identifier.
# - title: candidate source title; use null when not verified.
# - authors: verified or user-supplied author names; use [] when unknown.
# - year: publication/preprint year; use null when not verified.
# - arxiv: arXiv identifier without the "arXiv:" prefix, or null.
# - doi: DOI string, or null.
# - reason_for_relevance: short provenance-neutral reason for considering the source.
# - target_topics: topic ids that the source might support after approval and intake.
# - expected_gaps_filled: candidate-only expectations; these do not support claims.
# - access_status: short access note, such as unknown, open_access_arxiv_downloaded, or paywalled.
# - risk_notes: hallucination, notation, bibliographic, or scope risks.
# - status: one of candidate, approved, downloaded, rejected.
#
# Candidate entries never support claims until the source is downloaded, ingested, and
# recorded in the source and claim registries with source locations.
