# Canonical topic maturity tracker.
#
# Schema:
# - topic_id: id from data/topics.yml.
# - page: Markdown file under content/topics/.
# - maturity: one of stub, orientation, definition-ready, example-ready, study-ready, reviewed.
# - missing_components: zero or more of definition, setup and notation, basic picture,
#   example, main facts, source notes, connections.
# - source_coverage: short note on existing source support.
# - readability_status: short audit note, not reader-facing prose.
# - notation_status: short audit note, not reader-facing prose.
# - publication_status: one of publishable, incomplete; public readiness label.
# - publication_note: short Korean public-facing readiness note for topic-status.md.
# - blocking_components: components that block publishable status; empty if publishable.
# - last_audited: ISO date, or null.
# - next_review: short trigger or ISO date for the next audit.
