    statement: >-
      Hong and Kang define weight spaces for a \(U_q(\mathfrak g)\)-module \(V^q\), write \(V^q=\bigoplus_{\mu\in P}V^q_\mu\), and introduce weight vectors, maximal vectors, and characters in this setting.
    paraphrase: 'Weight modules provide the representation-theoretic setting from which crystal bases extract combinatorial data.'
