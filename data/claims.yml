    statement: >-
      Hernandez-Leclerc define \(\mathcal C_\ell\) as the full subcategory of \(\mathcal C_{\mathbb Z}\) consisting of objects whose composition factors have Drinfeld-polynomial roots in the finite set \(\{q^{-2k-\xi_i}\mid 0\le k\le \ell\}\) for every \(i\in I\).
    paraphrase: 'The category \(\mathcal C_\ell\) is cut out by restricting allowed Drinfeld-polynomial roots to a finite spectral-parameter window.'
