  - id: hongkang02-lie-algebra-definition
    status: sourced
    mathematical_status: definition
    level: core
    mathematical_level: object-level
    source: hong-kang02-introduction-quantum-groups-crystal-bases
    source_location: "Chapter 1, Definition 1.1.1, pp.1-2"
    topic_pages:
      - content/topics/lie-algebras-and-hopf-algebras.md
      - content/topics/quantum-groups.md
    statement: >-
      Hong and Kang define a Lie algebra \(L\) over \(\mathbb F\) as a vector space with a bilinear bracket \([x,y]\) satisfying \([x,x]=0\) and the Jacobi identity.
    paraphrase: 'Lie algebras are vector spaces whose bracket is controlled by anti-commutativity and Jacobi identity.'
    verified_by_user: false
  - id: hongkang02-lie-representation-module-definition
    status: sourced
    mathematical_status: definition
    level: core
    mathematical_level: object-level
    source: hong-kang02-introduction-quantum-groups-crystal-bases
    source_location: "Chapter 1, Definition 1.2.1, p.3"
    topic_pages:
      - content/topics/lie-algebras-and-hopf-algebras.md
    statement: >-
      Hong and Kang define a representation of a Lie algebra \(L\) on a vector space \(V\) as a Lie algebra homomorphism \(L\to\mathfrak{gl}(V)\), and define an \(L\)-module by a compatible bilinear action \(L\times V\to V\).
    paraphrase: 'Representations and modules provide the action language used before passing to enveloping algebras.'
    verified_by_user: false
  - id: hongkang02-universal-enveloping-algebra-pbw
    status: sourced
    mathematical_status: theorem
    level: core
    mathematical_level: object-level
    source: hong-kang02-introduction-quantum-groups-crystal-bases
    source_location: "Chapter 1, Definition 1.2.3, p.4; Theorem 1.2.4, p.5"
    topic_pages:
      - content/topics/lie-algebras-and-hopf-algebras.md
      - content/topics/quantum-groups.md
    statement: >-
      Hong and Kang define the universal enveloping algebra \(U(L)\) by its universal property, describe it as generated by \(L\) with relations \(xy-yx=[x,y]\), and state the Poincare-Birkhoff-Witt theorem giving an ordered monomial basis.
    paraphrase: 'The enveloping algebra turns Lie algebra representations into associative algebra representations while retaining an ordered basis model.'
    verified_by_user: false
  - id: hongkang02-hopf-algebra-definition-ul-example
    status: sourced
    mathematical_status: definition
    level: core
    mathematical_level: object-level
    source: hong-kang02-introduction-quantum-groups-crystal-bases
    source_location: "Chapter 1, Definition 1.5.3, p.17; Example 1.5.4(3), p.18"
    topic_pages:
      - content/topics/lie-algebras-and-hopf-algebras.md
      - content/topics/quantum-groups.md
    statement: >-
      Hong and Kang define a Hopf algebra \(\mathcal H\) by multiplication, comultiplication, unit, counit, and antipode satisfying compatibility conditions, and give \(U(L)\) as a Hopf algebra with \(\Delta(x)=x\otimes 1+1\otimes x\), \(\varepsilon(x)=0\), and \(S(x)=-x\).
    paraphrase: 'Hopf algebra structure is the mechanism behind tensor products and duals of modules.'
    verified_by_user: false
  - id: brundan13-quiver-hecke-algebra-definition
    status: sourced
    mathematical_status: definition
    level: core
    mathematical_level: object-level
    source: brundan13-quiver-hecke-algebras-categorification
    source_location: "Section 2, arXiv pp.6-7"
    topic_pages:
      - content/topics/quiver-hecke-algebras.md
    statement: >-
      Brundan defines, for a loop-free quiver with finite vertex set \(I\), the symmetric quiver-Hecke algebra \(H_\alpha\) for \(\alpha\in Q_+\) by idempotents \(1_{\mathbf i}\), polynomial generators \(x_1,\ldots,x_n\), crossing generators \(\tau_1,\ldots,\tau_{n-1}\), and explicit KLR relations.
    paraphrase: 'A quiver-Hecke algebra is a graded algebra attached to a quiver and a positive root, presented by word idempotents, dots, and crossings.'
    verified_by_user: false
  - id: brundan13-diagrammatic-quiver-hecke-category
    status: sourced
    mathematical_status: interpretation
    level: core
    mathematical_level: category-level
    source: brundan13-quiver-hecke-algebras-categorification
    source_location: "Section 2, arXiv pp.7-8"
    topic_pages:
      - content/topics/quiver-hecke-algebras.md
    statement: >-
      Brundan explains a diagrammatic interpretation of the simply-laced quiver-Hecke category in which objects are words in \(I\), dots represent \(x\), crossings represent \(\tau\), vertical concatenation is composition, and horizontal concatenation is tensor product.
    paraphrase: 'The generators can be read as colored strand diagrams, which gives a concrete picture of idempotents, dots, crossings, and composition.'
    verified_by_user: false
  - id: brundan13-quiver-hecke-basis-theorem
    status: sourced
    mathematical_status: theorem
    level: core
    mathematical_level: object-level
    source: brundan13-quiver-hecke-algebras-categorification
    source_location: "Theorem 2.6, arXiv pp.8-9"
    topic_pages:
      - content/topics/quiver-hecke-algebras.md
    statement: >-
      Brundan's basis theorem states that the monomials \(x_1^{m_1}\cdots x_n^{m_n}\tau_w1_{\mathbf i}\), with \(\mathbf i\in\langle I\rangle_\alpha\), \(w\in S_n\), and \(m_1,\ldots,m_n\ge 0\), form a basis of \(H_\alpha\).
    paraphrase: 'The generators and relations give a controlled PBW-like spanning model for \(H_\alpha\).'
    verified_by_user: false
  - id: brundan13-khovanov-lauda-categorification-theorem
    status: sourced
    mathematical_status: theorem
    level: core
    mathematical_level: Grothendieck-ring-level
    source: brundan13-quiver-hecke-algebras-categorification
    source_location: "Theorem 3.9, arXiv p.15"
    topic_pages:
      - content/topics/quiver-hecke-algebras.md
      - content/topics/monoidal-categorification.md
    statement: >-
      Brundan states the Khovanov-Lauda categorification theorem: there is an isomorphism of twisted bialgebras from Lusztig's integral form \(f_{\mathbb Z[q,q^{-1}]}\) to the Grothendieck group \([\operatorname{Proj}(H)]\), sending \(\theta_i\) to \([H_{\alpha_i}]\).
    paraphrase: 'Projective modules over quiver-Hecke algebras categorify one half of the quantum group.'
    verified_by_user: false
