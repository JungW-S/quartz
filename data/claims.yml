    source_location: "Definition 2.1.3, pp.22-23"
    topic_pages:
      - content/topics/quantum-groups.md
    statement: >-
      Hong and Kang define the Kac-Moody algebra \(\mathfrak g\) associated with a Cartan datum by generators and relations involving the Cartan subalgebra, simple root vectors, simple coroots, and Serre relations.
    paraphrase: 'The Kac-Moody algebra is the classical algebraic object whose quantized enveloping algebra is later deformed.'
    verified_by_user: false
  - id: hongkang02-quantum-group-definition
    status: sourced
    mathematical_status: definition
