    statement: >-
      For a real commuting family of braiders \((C_i,R_{C_i})_{i\in I}\) in a monoidal category \(\mathcal T\), KKOP21 constructs a monoidal category \(\mathcal T[C_i^{\otimes -1}\mid i\in I]\) and a monoidal functor \(\Upsilon:\mathcal T\to\mathcal T[C_i^{\otimes -1}\mid i\in I]\) such that the \(\Upsilon(C_i)\) are invertible and the \(\Upsilon(R_{C_i}(X))\) are isomorphisms, with the corresponding universal property.
    paraphrase: 'Localization freely forces the chosen braider objects to become invertible while preserving the compatible braiding maps.'
    verified_by_user: false
