    statement: >-
      Hong and Kang introduce a Cartan datum consisting of a generalized Cartan matrix together with a weight lattice \(P\), dual lattice \(P^\vee\), simple roots \(\alpha_i\), simple coroots \(h_i\), fundamental weights, root lattice \(Q\), and Weyl group notation.
    paraphrase: 'The Cartan datum packages the root and weight notation needed before defining quantum groups and crystals.'
