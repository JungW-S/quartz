    statement: >-
      Marberg gives type \(A_{n-1}\) examples in which roots are differences \(e_i-e_j\), simple roots are \(e_i-e_{i+1}\), and dominant weights in the \(GL(n)\) lattice satisfy \(\lambda_1\ge\cdots\ge\lambda_n\).
    paraphrase: 'Type \(A\) gives a concrete coordinate model for roots, simple roots, and dominant weights.'
