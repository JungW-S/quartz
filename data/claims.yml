    topic_pages:
      - content/topics/quantum-groups.md
    statement: >-
      Hong and Kang define the quantum group \(U_q(\mathfrak g)\) over \(\mathbb F(q)\) by generators \(e_i\), \(f_i\), and \(q^h\), with Cartan, weight-action, commutator, and quantum Serre relations.
    paraphrase: 'The quantum group is the \(q\)-deformed enveloping algebra underlying the crystal-base construction.'
    verified_by_user: false
  - id: hongkang02-quantum-group-hopf-structure
    status: sourced
    mathematical_status: proposition
