    statement: >-
      After specializing \(q^{1/2}\mapsto 1\) and fixing an initial seed, Qin defines the extended \(g\)-vector \(\widetilde g_i(t)\in\mathbb Z^m\) of a cluster variable \(X_i(t)\) by the expansion \(X_i(t)|_{q^{1/2}\mapsto 1}=X^{\widetilde g_i(t)}F(Y_1,\ldots,Y_n)\); the restriction to the first \(n\) components is called the \(g\)-vector.
    paraphrase: 'A cluster variable has a seed-dependent degree vector, and the exchangeable part is the \(g\)-vector.'
