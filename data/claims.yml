    topic_pages:
      - content/topics/quantum-groups.md
    statement: >-
      Hong and Kang state that \(U_q(\mathfrak g)\) has a Hopf algebra structure, giving explicit formulas for comultiplication, counit, and antipode on the generators.
    paraphrase: 'The Hopf structure is what makes tensor products of quantum-group representations available.'
    verified_by_user: false
  - id: hongkang02-quantum-weight-modules
    status: sourced
