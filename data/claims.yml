    statement: >-
      Hernandez-Leclerc state that \(\mathcal C_\ell\) is an abelian monoidal category and that its Grothendieck ring \(R_\ell\) is the polynomial ring generated by the classes \([V_{i,q^{2k+\xi_i}}]\) for \(i\in I\) and \(0\le k\le \ell\).
    paraphrase: 'The Grothendieck ring of \(\mathcal C_\ell\) is a polynomial ring in the allowed fundamental-module classes.'
