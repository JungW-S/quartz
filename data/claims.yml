    statement: >-
      Hernandez-Leclerc describe \(\mathcal C_0\) by saying that tensor products of fundamental modules in \(\mathcal C_0\) are simple, every simple object of \(\mathcal C_0\) is a tensor product of fundamental modules corresponding to the irreducible factors of its Drinfeld polynomials, and tensor products of simple objects in \(\mathcal C_0\) are simple.
