    statement: >-
      KKOP21 defines a left braider in a monoidal category \(\mathcal T\) as an object \(C\) equipped with functorial morphisms \(R_C(X):C\otimes X\to X\otimes C\) satisfying the tensor-product and unit compatibility diagrams; in a \(k\)-linear monoidal category a family \((C_i,R_{C_i})_{i\in I}\) is real commuting when \(R_{C_i}(C_i)\) and \(R_{C_j}(C_i)\circ R_{C_i}(C_j)\) are scalar identity maps of the required tensor products.
    paraphrase: 'The localization input is not merely a set of objects, but a family of objects carrying controlled one-sided braiding data.'
    verified_by_user: false
